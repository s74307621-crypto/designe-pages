<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>صفحه پرداخت - دانشمند</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">دانشمند</div>
      <nav class="nav" role="navigation" aria-label="منوی اصلی">
        <a href="index.html">خانه</a>
        <a href="courses.html">دوره‌ها</a>
        <a href="my-courses.html">دوره‌های من</a>
        <a href="profile.html">پروفایل</a>
        <a href="sign-up.html">ورود / ثبت‌نام</a>
        <a href="cart.html">سبد خرید</a>
      </nav>
    </header>

    <main role="main" aria-labelledby="checkout-title" class="card">
      <h1 id="checkout-title" class="page-title">پرداخت</h1>
      <form action="#" method="post" class="checkout-form">
        <label for="card-name">نام روی کارت</label>
        <input type="text" id="card-name" name="card-name" placeholder="نام کامل" required />
        <label for="card-number">شماره کارت</label>
        <input type="text" id="card-number" name="card-number" placeholder="۱۲۳۴ ۵۶۷۸ ۹۰۱۲ ۳۴۵۶" required />
        <label for="expiry">تاریخ انقضا</label>
        <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required />
        <label for="cvv">کد CVV</label>
        <input type="text" id="cvv" name="cvv" placeholder="۳ رقمی پشت کارت" required />
        <button type="submit">پرداخت</button>
      </form>
    </main>

    <footer class="footer">
      <p>© 2025 دانشمند. همه حقوق محفوظ است.</p>
    </footer>
  </div>
</body>
</html>
