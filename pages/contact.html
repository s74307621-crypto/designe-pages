            <label for="message">پیام</label>
            <textarea id="message" name="message" placeholder="پیام شما..." required></textarea>

            <button type="submit">ارسال پیام</button>
          </form>
        </div>

        <div class="col">
          <div class="contact-info">
            <h2>راه‌های ارتباطی</h2>

            <p><strong>ایمیل:</strong> Danesh@gmail.com</p>
            <p><strong>تلفن:</strong> 031-XXXXXXXX</p>
            <hr style="margin:12px 0;border:none;border-top:1px solid #eee">
            <h3>ساعات کاری</h3>
            <p>شنبه تا چهارشنبه: ۹:۰۰ — ۱۷:۰۰</p>
            <p>پنج‌شنبه: ۹:۰۰ — ۱۳:۰۰</p>
