<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>پروفایل - دانشمند</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="index.html" class="brand">
        <img src="images/logo-site.png" alt="دانشمند">
      </a>
      <nav class="nav" role="navigation" aria-label="منوی اصلی">
        <a href="index.html">خانه</a>
        <a href="courses.html">دوره‌ها</a>
        <a href="my-courses.html">دوره‌های من</a>
        <a href="profile.html" class="active">پروفایل</a>
        <a href="sign-up.html">ورود / ثبت‌نام</a>
        <a href="cart.html" class="m3-badge-wrapper cart-icon">سبد خرید
          <span id="cartBadge" class="m3-badge--large">0</span>
        </a>
      </nav>
    </header>

    <main role="main" aria-labelledby="profile-title" class="card">
      <h1 id="profile-title" class="page-title">پروفایل من</h1>
      <form action="#" method="post" class="profile-form">
        <label for="name">نام کامل</label>
        <input type="text" id="name" name="name" placeholder="نام شما" required />
        <label for="email">ایمیل</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required />
        <button type="submit">ذخیره تغییرات</button>
      </form>
    </main>

    <footer class="footer">
      <p>© 2025 دانشمند. همه حقوق محفوظ است.</p>
    </footer>
  </div>
</body>
</html>
