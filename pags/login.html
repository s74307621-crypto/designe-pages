<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>ورود | ثبت‌نام</title>

  <link rel="stylesheet" href="/css/login.css">

 
</head>

<body class="light ">
    <div id="headerPlaceholder"></div>
<section class="auth-section">
  <div class="m3-card m3-card--elevated auth-card">

    <!-- ===== LOGIN ===== -->
    <form id="loginForm" class="login-form">
      <div class="auth-title">ورود به حساب</div>

      <div class="m3-text-field">
        <input type="email" placeholder=" " required>
        <label>ایمیل</label>
      </div>

      <div class="m3-text-field">
        <input type="password" placeholder=" " required>
        <label>رمز عبور</label>
      </div>

      <label class="m3-checkbox">
        <input type="checkbox">
        <span>مرا به خاطر بسپار</span>
      </label>

      <button class="m3-btn m3-btn--filled m3-btn--lg" type="submit">
        ورود
      </button>

      <div class="auth-switch">
        حساب ندارید؟
        <a href="#" onclick="toggleAuth()">ثبت‌نام</a>
      </div>
    </form>

    <!-- ===== REGISTER ===== -->
    <form id="registerForm" class="hidden register-form">
      <div class="auth-title">ثبت‌نام</div>

      <div class="m3-text-field">
        <input type="text" placeholder=" " required>
        <label>نام و نام خانوادگی</label>
      </div>

      <div class="m3-text-field">
        <input type="email" placeholder=" " required>
        <label>ایمیل</label>
      </div>

      <div class="m3-text-field">
        <input type="password" placeholder=" " required>
        <label>رمز عبور</label>
      </div>

      <!-- نوع حساب -->
      <div>
        <label class="m3-radio">
          <input type="radio" name="role" checked>
          <span>کاربر</span>
        </label>

        <label class="m3-radio" style="margin-right:16px">
          <input type="radio" name="role">
          <span>مدرس</span>
        </label>
      </div>

      <button class="m3-btn m3-btn--filled m3-btn--lg" type="submit">
        ثبت‌نام
      </button>

      <div class="auth-switch">
        حساب دارید؟
        <a href="#" onclick="toggleAuth()">ورود</a>
      </div>
    </form>

  </div>
  </section>
    <div id="footer-placeholder"></div>

<script>
    fetch("/components/footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer-placeholder").innerHTML = data;
        });
        fetch('/components/header.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('headerPlaceholder').innerHTML = data;
  });
    function toggleAuth() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('loginForm').classList.add('login-form');
      document.getElementById('registerForm').classList.add('register-form');
      document.getElementById('registerForm').classList.toggle('hidden');
    }
</script>


  
</body>
</html>
