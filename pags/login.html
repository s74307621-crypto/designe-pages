<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | ثبت‌نام</title>
  <link rel="stylesheet" href="/css/login.css">
</head>

<body class="light">
  <div id="headerPlaceholder"></div>

  <section class="auth-section">
    <div class="m3-card m3-card--elevated auth-card">

      <!-- تب‌ها -->
      <div class="auth-tabs" style="display: flex; gap: 16px; justify-content: center; margin-bottom: 16px;">
        <button type="button" class="m3-btn m3-btn--tonal" id="tab-login">ورود</button>
        <button type="button" class="m3-btn m3-btn--tonal" id="tab-register">ثبت‌نام</button>
      </div>

      <!-- ===== LOGIN FORM ===== -->
      <form id="loginForm" class="auth-form login-form" novalidate>
        <div class="auth-title">ورود به حساب</div>

        <div class="m3-text-field">
          <input type="email" id="login-email" name="email" placeholder=" " required>
          <label for="login-email">ایمیل</label>
          <div class="error-message" id="login-email-error"></div>
        </div>

        <div class="m3-text-field">
          <input type="password" id="login-password" name="password" placeholder=" " required>
          <label for="login-password">رمز عبور</label>
          <div class="error-message" id="login-password-error"></div>
        </div>

        <label class="m3-checkbox">
          <input type="checkbox" name="remember">
          <span>مرا به خاطر بسپار</span>
        </label>

        <button class="m3-btn m3-btn--filled m3-btn--lg" type="submit">
          ورود
        </button>
      </form>

      <!-- ===== REGISTER FORM ===== -->
      <form id="registerForm" class="auth-form register-form hidden" novalidate>
        <div class="auth-title">ثبت‌نام</div>

        <div class="m3-text-field">
          <input type="text" id="register-fullname" name="fullname" placeholder=" " required>
          <label for="register-fullname">نام و نام خانوادگی</label>
          <div class="error-message" id="register-fullname-error"></div>
        </div>

        <div class="m3-text-field">
          <input type="email" id="register-email" name="email" placeholder=" " required>
          <label for="register-email">ایمیل</label>
          <div class="error-message" id="register-email-error"></div>
        </div>

        <div class="m3-text-field">
          <input type="password" id="register-password" name="password" placeholder=" " required>
          <label for="register-password">رمز عبور</label>
          <div class="error-message" id="register-password-error"></div>
        </div>

        <!-- نوع حساب -->
        <div style="display: flex; gap: 24px; margin-top: 8px;">
          <label class="m3-radio">
            <input type="radio" name="role" value="user" checked>
            <span>کاربر</span>
          </label>
          <label class="m3-radio">
            <input type="radio" name="role" value="instructor">
            <span>مدرس</span>
          </label>
        </div>

        <button class="m3-btn m3-btn--filled m3-btn--lg" type="submit">
          ثبت‌نام
        </button>
      </form>

    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- جدا کردن JS -->
  <script src="/js/login.js"></script>
</body>
</html>
