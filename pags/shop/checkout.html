<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسویه حساب | نرسی‌مِد</title>
  <link rel="stylesheet" href="../../css/shop/checkout.css">
          <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <link rel="stylesheet" href="../../css/header.css">
</head>
<body>

<div id="headerPlaceholder"></div>

<section class="checkout-page">
  <h1 class="page-title">تسویه حساب</h1>

  <div class="checkout-container">

    <!-- USER FORM -->
    <form class="checkout-form">
      <h3>اطلاعات خریدار</h3>

      <label for="fullname">نام و نام خانوادگی</label>
      <input type="text" id="fullname" placeholder="مثلاً: علی احمدی" required>

      <label for="email">ایمیل</label>
      <input type="email" id="email" placeholder="example@mail.com" required>

      <label for="phone">شماره موبایل</label>
      <input type="text" id="phone" placeholder="09xxxxxxxxx" required>

      <h3>روش پرداخت</h3>
      <div class="payment-methods">
        <label>
          <input type="radio" name="payment" checked>
          پرداخت آنلاین با کارت
        </label>
        <label>
          <input type="radio" name="payment">
          پرداخت در محل
        </label>
      </div>

      <button type="submit" class="btn-primary-filled-sm">پرداخت و ثبت سفارش</button>
    </form>

    <!-- ORDER SUMMARY -->
    <aside class="order-summary">
      <h3>خلاصه سفارش</h3>

      <div class="summary-item">
        <span>دوره جامع ICU بزرگسال</span>
        <span>3,200,000 تومان</span>
      </div>

      <div class="summary-item">
        <span>فوریت‌های پزشکی پیشرفته</span>
        <span>2,750,000 تومان</span>
      </div>

      <div class="summary-row">
        <span>جمع جزء</span>
        <span>5,950,000 تومان</span>
      </div>

      <div class="summary-row">
        <span>تخفیف</span>
        <span>0 تومان</span>
      </div>

      <div class="summary-row total">
        <span>مبلغ قابل پرداخت</span>
        <span>5,950,000 تومان</span>
      </div>

    </aside>

  </div>
</section>
    <!-- Footer -->
  <div id="footer-placeholder"></div>

<script>
    fetch("../../components/footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer-placeholder").innerHTML = data;
        });
</script>
<script>
fetch('../../components/header.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('headerPlaceholder').innerHTML = data;
  });
</script>
</body>
</html>
