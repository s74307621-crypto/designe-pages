<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روش پرداخت</title>
<link rel="stylesheet" href="../css/header.css">
<link rel="stylesheet" href="../css/main.css">
</head>
<body>

<div id="header"></div>
<script>
fetch("../components/header.html")
  .then(response => response.text())
  .then(data => document.getElementById("header").innerHTML = data);
</script>

<main class="main-container">
  <h1>انتخاب روش پرداخت</h1>
  <form class="payment-form">
    <label>نحوه پرداخت:</label>
    <select name="payment-method">
      <option value="online">پرداخت اینترنتی</option>
      <option value="card-to-card">کارت به کارت</option>
      <option value="cash">پرداخت هنگام تحویل</option>
    </select>

    <label>انتخاب درگاه (اگر پرداخت اینترنتی):</label>
    <select name="gateway">
      <option value="zarinpal">زرین پال</option>
      <option value="pay.ir">پی‌اِی</option>
    </select>

    <a href="invoice.html" class="auth-btn">نمایش پیش‌فاکتور</a>
  </form>
</main>

</body>
</html>
